<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallach's Motion Integration (Vector Average)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }
        
        .canvas-container {
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            background-color: #ffffff; /* White background for the gratings */
            padding: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .control-group {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            border: 1px solid #444;
        }

        .control-group span {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        button {
            background-color: #444;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            width: 180px;
        }

        button.active {
            background-color: #007aff;
            box-shadow: 0 0 10px rgba(0, 122, 255, 0.4);
        }

        button.reveal {
            background-color: #ff3b30;
        }
        
        button:hover {
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="experimentCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <span>Independent Vectors</span>
            <button id="btnGratingA" class="active">Grating A ( / )</button>
            <button id="btnGratingB" class="active">Grating B ( \ )</button>
        </div>
        <div class="control-group">
            <span>Aperture Problem</span>
            <button id="btnAperture" class="active">Window Mask: ON</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('experimentCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 600;
        const HEIGHT = 500;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // Independent animation phases for the two vectors
        let phaseA = 0; 
        let phaseB = 0;
        
        // Speeds (moving at the exact same speed creates a perfect orthogonal vector average)
        const speedA = 0.6; 
        const speedB = 0.6; 

        // Toggles
        let showA = true;
        let showB = true;
        let showAperture = true;

        // Button Listeners
        const btnA = document.getElementById('btnGratingA');
        const btnB = document.getElementById('btnGratingB');
        const btnAp = document.getElementById('btnAperture');

        btnA.addEventListener('click', () => {
            showA = !showA;
            btnA.classList.toggle('active', showA);
        });

        btnB.addEventListener('click', () => {
            showB = !showB;
            btnB.classList.toggle('active', showB);
        });

        btnAp.addEventListener('click', () => {
            showAperture = !showAperture;
            if (showAperture) {
                btnAp.textContent = "Window Mask: ON";
                btnAp.className = "active";
            } else {
                btnAp.textContent = "Window Mask: OFF";
                btnAp.className = "reveal";
            }
        });

        // 1. Create a single transparent tile with ONE vertical line
        const pCanvas = document.createElement('canvas');
        const pCtx = pCanvas.getContext('2d');
        const pSize = 45; // Spacing between lines
        
        pCanvas.width = pSize;
        pCanvas.height = pSize;
        
        // Transparent background so the two layers can blend
        pCtx.clearRect(0, 0, pSize, pSize);

        // Draw a single thick black line down the middle
        pCtx.lineWidth = 10; 
        pCtx.strokeStyle = '#000000';
        pCtx.beginPath();
        pCtx.moveTo(pSize / 2, 0); 
        pCtx.lineTo(pSize / 2, pSize); 
        pCtx.stroke();

        // Create the pattern (which is just an infinite set of vertical lines)
        const linePattern = ctx.createPattern(pCanvas, 'repeat');

        // 2. Main Render Loop
        function draw() {
            // Base background is white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // --- GRATING A ---
            if (showA) {
                ctx.save();
                ctx.translate(WIDTH / 2, HEIGHT / 2);
                // Rotate to +45 degrees ( / )
                ctx.rotate(45 * Math.PI / 180);
                // Move it along its local X-axis (perpendicular to its lines)
                ctx.translate(phaseA, 0); 
                
                ctx.fillStyle = linePattern;
                ctx.fillRect(-1500, -1500, 3000, 3000);
                ctx.restore();
            }

            // --- GRATING B ---
            if (showB) {
                ctx.save();
                ctx.translate(WIDTH / 2, HEIGHT / 2);
                // Rotate to -45 degrees ( \ )
                ctx.rotate(-45 * Math.PI / 180);
                // Move it along its local X-axis (perpendicular to its lines)
                ctx.translate(phaseB, 0); 
                
                ctx.fillStyle = linePattern;
                ctx.fillRect(-1500, -1500, 3000, 3000);
                ctx.restore();
            }

            // --- THE APERTURE MASK ---
            if (showAperture) {
                ctx.fillStyle = '#000000'; // Black wall
                ctx.beginPath();
                
                // Draw solid bounding box
                ctx.rect(0, 0, WIDTH, HEIGHT);
                
                // Cut out a transparent circle
                ctx.arc(WIDTH / 2, HEIGHT / 2, 180, 0, Math.PI * 2, true);
                
                ctx.fill();
            }

            // Advance the independent vectors
            phaseA += speedA;
            phaseB += speedB;

            requestAnimationFrame(draw);
        }

        // Start animation
        draw();
    </script>
</body>
</html>
