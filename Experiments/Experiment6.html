<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trichromatic Color Matching Experiment</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #050505; /* Pitch black for vision experiments */
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .experiment-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            background: #1a1a1a;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 800px;
            align-items: center;
            border: 1px solid #333;
        }

        /* The Classic Bipartite Field */
        .aperture {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            box-shadow: 0 0 0 10px #000, 0 0 30px rgba(255,255,255,0.1);
            position: relative;
        }

        /* A thin black line dividing the field makes it easier to compare */
        .aperture::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background-color: #000;
            transform: translateX(-50%);
        }

        .field {
            flex: 1;
            height: 100%;
            transition: background-color 0.1s ease;
        }

        .labels {
            display: flex;
            width: 300px;
            justify-content: space-between;
            margin-top: -15px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #888;
            text-transform: uppercase;
        }

        /* Control Panel */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            background: #111;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-group label {
            width: 60px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .val-display {
            width: 40px;
            text-align: right;
            font-family: monospace;
            font-size: 16px;
            color: #aaa;
        }

        input[type="range"] {
            flex: 1;
            cursor: pointer;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* Specific slider track colors */
        #rSlider { accent-color: #ff3b30; }
        #rSlider::-webkit-slider-thumb { border: 3px solid #ff3b30; }
        
        #gSlider { accent-color: #34c759; }
        #gSlider::-webkit-slider-thumb { border: 3px solid #34c759; }
        
        #bSlider { accent-color: #007aff; }
        #bSlider::-webkit-slider-thumb { border: 3px solid #007aff; }

        /* Buttons */
        .button-row {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        button {
            flex: 1;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover { background-color: #444; }
        #btnReveal.active { background-color: #ff3b30; }

        /* Results / Legend */
        .results {
            width: 100%;
            background: #000;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            color: #fff;
            display: none;
            justify-content: space-between;
            border: 1px dashed #555;
        }
    </style>
</head>
<body>

    <div class="experiment-container">
        
        <div class="aperture">
            <div id="targetField" class="field"></div>
            <div id="matchField" class="field"></div>
        </div>
        <div class="labels">
            <span>Target</span>
            <span>Match</span>
        </div>

        <div class="controls">
            <div class="slider-group">
                <label style="color: #ff3b30;">RED</label>
                <input type="range" id="rSlider" min="0" max="255" value="0">
                <span id="rVal" class="val-display">0</span>
            </div>
            
            <div class="slider-group">
                <label style="color: #34c759;">GREEN</label>
                <input type="range" id="gSlider" min="0" max="255" value="0">
                <span id="gVal" class="val-display">0</span>
            </div>
            
            <div class="slider-group">
                <label style="color: #007aff;">BLUE</label>
                <input type="range" id="bSlider" min="0" max="255" value="0">
                <span id="bVal" class="val-display">0</span>
            </div>
        </div>

        <div class="button-row">
            <button id="btnNewTarget">New Random Target</button>
            <button id="btnReveal">Reveal True Values</button>
        </div>

        <div id="results" class="results">
            <span id="resTarget">Target: rgb(0,0,0)</span>
            <span id="resMatch">Match: rgb(0,0,0)</span>
            <span id="resError">Accuracy: 0%</span>
        </div>

    </div>

    <script>
        // DOM Elements
        const targetField = document.getElementById('targetField');
        const matchField = document.getElementById('matchField');
        
        const rSlider = document.getElementById('rSlider');
        const gSlider = document.getElementById('gSlider');
        const bSlider = document.getElementById('bSlider');
        
        const rVal = document.getElementById('rVal');
        const gVal = document.getElementById('gVal');
        const bVal = document.getElementById('bVal');

        const btnNewTarget = document.getElementById('btnNewTarget');
        const btnReveal = document.getElementById('btnReveal');
        const results = document.getElementById('results');
        const resTarget = document.getElementById('resTarget');
        const resMatch = document.getElementById('resMatch');
        const resError = document.getElementById('resError');

        // State
        let targetRGB = [0, 0, 0];

        // Generate a random target color
        function generateTarget() {
            // Keep colors relatively bright to ensure they are matchable
            targetRGB = [
                Math.floor(Math.random() * 200) + 55,
                Math.floor(Math.random() * 200) + 55,
                Math.floor(Math.random() * 200) + 55
            ];
            targetField.style.backgroundColor = `rgb(${targetRGB[0]}, ${targetRGB[1]}, ${targetRGB[2]})`;
            
            // Reset UI
            rSlider.value = 0; gSlider.value = 0; bSlider.value = 0;
            updateMatch();
            results.style.display = 'none';
            btnReveal.classList.remove('active');
            btnReveal.innerText = "Reveal True Values";
        }

        // Update the match field based on sliders
        function updateMatch() {
            const r = rSlider.value;
            const g = gSlider.value;
            const b = bSlider.value;

            rVal.innerText = r;
            gVal.innerText = g;
            bVal.innerText = b;

            matchField.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        // Calculate how accurate the user's match is
        function calculateAccuracy() {
            const r = parseInt(rSlider.value);
            const g = parseInt(gSlider.value);
            const b = parseInt(bSlider.value);

            // Calculate Euclidean distance in RGB space
            const rDiff = targetRGB[0] - r;
            const gDiff = targetRGB[1] - g;
            const bDiff = targetRGB[2] - b;
            
            const distance = Math.sqrt(rDiff*rDiff + gDiff*gDiff + bDiff*bDiff);
            const maxDistance = Math.sqrt(255*255 * 3); // Max possible error
            
            // Convert to percentage
            let accuracy = 100 - ((distance / maxDistance) * 100);
            return accuracy.toFixed(1);
        }

        // Listeners
        rSlider.addEventListener('input', updateMatch);
        gSlider.addEventListener('input', updateMatch);
        bSlider.addEventListener('input', updateMatch);

        btnNewTarget.addEventListener('click', generateTarget);

        btnReveal.addEventListener('click', () => {
            const r = rSlider.value;
            const g = gSlider.value;
            const b = bSlider.value;

            resTarget.innerText = `Target: [${targetRGB.join(', ')}]`;
            resMatch.innerText = `Match: [${r}, ${g}, ${b}]`;
            resError.innerText = `Accuracy: ${calculateAccuracy()}%`;

            results.style.display = 'flex';
            btnReveal.classList.add('active');
            btnReveal.innerText = "Values Revealed";
        });

        // Initialize
        generateTarget();
    </script>
</body>
</html>
