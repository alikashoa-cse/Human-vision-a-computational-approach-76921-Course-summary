<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrinsic Image Decomposition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .experiment-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            background: #222;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 1100px;
        }

        /* The 3-Panel Layout */
        .panels {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .panel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: capitalize;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #000;
            border: 2px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .math-operator {
            font-size: 40px;
            font-weight: bold;
            color: #888;
            padding-top: 25px; /* Offset to align with canvases */
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-around;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            flex-wrap: wrap;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .control-group span {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 60px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 4px; }

        .color-row {
            display: flex;
            gap: 15px;
        }

        .formula-box {
            text-align: center;
            margin-top: 10px;
            font-family: monospace;
            font-size: 16px;
            color: #007aff;
            background: #111;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="experiment-container">
        
        <div class="panels">
            <div class="panel-wrapper">
                <div class="panel-title">Reflectance (R)</div>
                <canvas id="canvasR" width="300" height="300"></canvas>
            </div>
            
            <div class="math-operator">×</div>
            
            <div class="panel-wrapper">
                <div class="panel-title">Illumination (L)</div>
                <canvas id="canvasL" width="300" height="300"></canvas>
            </div>
            
            <div class="math-operator">=</div>
            
            <div class="panel-wrapper">
                <div class="panel-title">Image (I)</div>
                <canvas id="canvasI" width="300" height="300"></canvas>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <span>Reflectance Stripes</span>
                <div class="color-row">
                    <input type="color" id="colR1" value="#8282FF" title="Stripe 1 Color">
                    <input type="color" id="colR2" value="#464646" title="Stripe 2 Color">
                </div>
            </div>

            <div class="control-group">
                <span>Illumination Light</span>
                <input type="color" id="colL" value="#FFFF78" title="Illumination Color">
            </div>
        </div>

        <div class="formula-box">
            I(R,G,B) = [ R(R,G,B) / 255 ] × [ L(R,G,B) / 255 ] × 255
        </div>

    </div>

    <script>
        const canvasR = document.getElementById('canvasR');
        const ctxR = canvasR.getContext('2d');
        
        const canvasL = document.getElementById('canvasL');
        const ctxL = canvasL.getContext('2d');
        
        const canvasI = document.getElementById('canvasI');
        const ctxI = canvasI.getContext('2d');

        const colR1 = document.getElementById('colR1');
        const colR2 = document.getElementById('colR2');
        const colL = document.getElementById('colL');

        // Listen for color changes
        colR1.addEventListener('input', draw);
        colR2.addEventListener('input', draw);
        colL.addEventListener('input', draw);

        // Helper to convert Hex to RGB array [r, g, b]
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : [0, 0, 0];
        }

        // Helper to multiply two RGB arrays based on light physics
        function multiplyRGB(rgb1, rgb2) {
            return [
                Math.round((rgb1[0] / 255) * (rgb2[0] / 255) * 255),
                Math.round((rgb1[1] / 255) * (rgb2[1] / 255) * 255),
                Math.round((rgb1[2] / 255) * (rgb2[2] / 255) * 255)
            ];
        }

        // Helper to turn RGB array into CSS string
        function rgbToStr(rgb) {
            return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
        }

        function draw() {
            const w = canvasR.width;
            const h = canvasR.height;
            const stripeHeight = h / 5; // 5 horizontal stripes

            // Get Current Colors
            const rgbR1 = hexToRgb(colR1.value);
            const rgbR2 = hexToRgb(colR2.value);
            const rgbLight = hexToRgb(colL.value);

            // Calculate Resulting Image Colors
            const rgbI1 = multiplyRGB(rgbR1, rgbLight);
            const rgbI2 = multiplyRGB(rgbR2, rgbLight);

            // 1. Draw Reflectance (R)
            ctxR.clearRect(0, 0, w, h);
            for(let i = 0; i < 5; i++) {
                ctxR.fillStyle = (i % 2 === 0) ? rgbToStr(rgbR1) : rgbToStr(rgbR2);
                ctxR.fillRect(0, i * stripeHeight, w, stripeHeight);
            }

            // 2. Draw Illumination (L)
            ctxL.fillStyle = rgbToStr(rgbLight);
            ctxL.fillRect(0, 0, w, h);

            // 3. Draw Image Result (I)
            ctxI.clearRect(0, 0, w, h);
            for(let i = 0; i < 5; i++) {
                ctxI.fillStyle = (i % 2 === 0) ? rgbToStr(rgbI1) : rgbToStr(rgbI2);
                ctxI.fillRect(0, i * stripeHeight, w, stripeHeight);
            }
        }

        // Initial render
        draw();
    </script>
</body>
</html>
