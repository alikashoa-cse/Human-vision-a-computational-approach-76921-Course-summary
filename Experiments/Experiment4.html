<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simultaneous Contrast Illusion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .experiment-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #222;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.9);
            max-width: 95vw;
            align-items: center;
        }

        /* The main display screen */
        .canvas-wrapper {
            width: 800px;
            height: 500px;
            background-color: #000000; /* Pure black to isolate the inner squares */
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Outer Background Squares */
        .outer-bg {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            /* Using transform for smooth performance */
            transition: transform 0.1s linear; 
        }

        #outerLeft {
            left: 0;
            background-color: #696969; /* Dark Gray */
        }

        #outerRight {
            right: 0;
            background-color: #cdcdcd; /* Light Gray */
        }

        /* Inner Target Squares */
        .inner-square {
            position: absolute;
            top: 50%;
            width: 160px;
            height: 160px;
            background-color: #9b9b9b; /* EXACT SAME Medium Gray for both */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        #innerLeft {
            left: 25%;
            transform: translate(-50%, -50%);
        }

        #innerRight {
            left: 75%;
            transform: translate(-50%, -50%);
        }

        /* Control Panel */
        .controls-row {
            display: flex;
            gap: 40px;
            width: 100%;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 300px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #007aff;
        }

        .toggle-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            height: 45px;
        }

        .toggle-btn.active-blue { background-color: #007aff; box-shadow: 0 0 15px rgba(0, 122, 255, 0.4); }
        .toggle-btn:hover { filter: brightness(1.2); }

    </style>
</head>
<body>

    <div class="experiment-container">
        
        <div class="canvas-wrapper">
            <div id="outerLeft" class="outer-bg"></div>
            <div id="outerRight" class="outer-bg"></div>
            
            <div id="innerLeft" class="inner-square"></div>
            <div id="innerRight" class="inner-square"></div>
        </div>

        <div class="controls-row">
            
            <div class="control-group">
                <label>Slide Outer Squares (Up/Down) <span id="valOffset">0%</span></label>
                <input type="range" id="bgSlider" min="-100" max="100" step="1" value="0">
            </div>

            <button id="btnConnect" class="toggle-btn">Connect Inner Squares</button>
            
        </div>

    </div>

    <script>
        // DOM Elements
        const bgSlider = document.getElementById('bgSlider');
        const valOffset = document.getElementById('valOffset');
        const outerLeft = document.getElementById('outerLeft');
        const outerRight = document.getElementById('outerRight');
        
        const innerLeft = document.getElementById('innerLeft');
        const innerRight = document.getElementById('innerRight');
        const btnConnect = document.getElementById('btnConnect');

        // State
        let isConnected = false;

        // 1. Slider Event: Move the Outer Backgrounds Up and Down
        bgSlider.addEventListener('input', (e) => {
            const offset = e.target.value;
            valOffset.innerText = offset + '%';
            
            // Translate Y moves them vertically out of the frame
            outerLeft.style.transform = `translateY(${offset}%)`;
            outerRight.style.transform = `translateY(${offset}%)`;
        });

        // 2. Button Event: Slide Inner Squares Horizontally to Connect
        btnConnect.addEventListener('click', () => {
            isConnected = !isConnected;
            
            if (isConnected) {
                // Move both to the exact center (50%)
                innerLeft.style.left = '50%';
                innerRight.style.left = '50%';
                
                // Adjust their transforms so they snap seamlessly side-by-side
                innerLeft.style.transform = 'translate(-100%, -50%)'; 
                innerRight.style.transform = 'translate(0%, -50%)';
                
                btnConnect.innerText = 'Reset Inner Squares';
                btnConnect.classList.add('active-blue');
            } else {
                // Return to original positions in the centers of their respective halves
                innerLeft.style.left = '25%';
                innerRight.style.left = '75%';
                
                innerLeft.style.transform = 'translate(-50%, -50%)';
                innerRight.style.transform = 'translate(-50%, -50%)';
                
                btnConnect.innerText = 'Connect Inner Squares';
                btnConnect.classList.remove('active-blue');
            }
        });
    </script>
</body>
</html>
