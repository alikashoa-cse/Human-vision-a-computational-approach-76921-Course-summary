<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Lines Experiment & Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Container to keep canvas centered */
        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: 80vh;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* Sleek UI Toggle Button */
        .controls {
            margin-top: 20px;
            z-index: 10;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background-color: #e0e0e0;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button.active-mode {
            background-color: #ff3b30;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="experimentCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="toggleBtn">Hide Shapes (Reveal Matrix)</button>
    </div>

    <script>
        const canvas = document.getElementById('experimentCanvas');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('toggleBtn');

        const WIDTH = 800;
        const HEIGHT = 400;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let lineOffset = 0;
        const animationSpeed = 0.7; 
        
        // State variable: true = show original shapes, false = fill entire background with lines
        let showShapes = true;

        // 1. Create the seamless static pattern canvas
        const patternCanvas = document.createElement('canvas');
        const pCtx = patternCanvas.getContext('2d');
        const pSize = 20; 
        
        patternCanvas.width = pSize;
        patternCanvas.height = pSize;
        pCtx.strokeStyle = '#ffffff';
        pCtx.lineWidth = 3;
        
        pCtx.beginPath();
        pCtx.moveTo(0, 0);
        pCtx.lineTo(pSize, pSize);
        pCtx.moveTo(0, pSize);
        pCtx.lineTo(pSize, pSize * 2);
        pCtx.moveTo(-pSize, 0);
        pCtx.lineTo(0, pSize);
        pCtx.stroke();

        const stripePattern = ctx.createPattern(patternCanvas, 'repeat');

        // Toggle Button Click Handler
        toggleBtn.addEventListener('click', () => {
            showShapes = !showShapes;
            if (showShapes) {
                toggleBtn.textContent = "Hide Shapes (Reveal Matrix)";
                toggleBtn.classList.remove('active-mode');
            } else {
                toggleBtn.textContent = "Show Shapes (Original Look)";
                toggleBtn.classList.add('active-mode');
            }
        });

        // 2. Main Animation & Render Loop
        function draw() {
            // Reset background to solid black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.save();
            // Shift coordinate space globally to drive line movement
            ctx.translate(lineOffset, 0);
            ctx.fillStyle = stripePattern;

            if (!showShapes) {
                // VERIFICATION MODE: Fill the entire canvas screen with the exact same moving lines
                ctx.fillRect(-pSize, 0, WIDTH + pSize * 2, HEIGHT);
            } else {
                // NORMAL MODE: Anchor coordinates backward so shapes stand still while lines slide through
                
                // Shape 1: Vertical rectangle on the left
                ctx.beginPath();
                ctx.rect(60 - lineOffset, 110, 50, 210);
                ctx.fill();

                // Shape 2: The Circle
                ctx.beginPath();
                ctx.arc(250 - lineOffset, 140, 50, 0, Math.PI * 2);
                ctx.fill();

                // Shape 3: Horizontal rectangle below circle
                ctx.beginPath();
                ctx.rect(155 - lineOffset, 235, 215, 45);
                ctx.fill();

                // Shape 4: The S/Z stepped block on the right
                ctx.beginPath();
                ctx.moveTo(355 - lineOffset, 120); 
                ctx.lineTo(515 - lineOffset, 120); 
                ctx.lineTo(515 - lineOffset, 225); 
                ctx.lineTo(645 - lineOffset, 225); 
                ctx.lineTo(645 - lineOffset, 270); 
                ctx.lineTo(465 - lineOffset, 270); 
                ctx.lineTo(465 - lineOffset, 165); 
                ctx.lineTo(355 - lineOffset, 165); 
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            // Continuously loop animation parameters
            lineOffset = (lineOffset + animationSpeed) % pSize;

            requestAnimationFrame(draw);
        }

        // Kickoff
        draw();
    </script>
</body>
</html>
